spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 1000
      hibernate.order_inserts: true
app:
  board:
    rate-limit:
      posts: 3
      comments: 10
      reports: 5
  security:
    ip-rate-limit:
      paths: /api/guest,/api/auth/signup,/api/auth/login
      max-requests: 20
      window-seconds: 600
  external:
    seoul:
      api-key: ${SEOUL_OPEN_API_KEY:}
    datagokr:
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
server:
  port: ${SERVER_PORT:8081}


