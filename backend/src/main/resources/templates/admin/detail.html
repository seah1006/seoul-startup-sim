<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('실행 상세')}"></head><body><header th:replace="~{admin/fragments :: nav}"></header><main><h1>실행 상세</h1><p th:text="${run.source + ' / ' + run.period + ' / ' + run.status}"></p><p th:text="${'조회 ' + run.fetched + ' · 추가 ' + run.inserted + ' · 갱신 ' + run.updated + ' · 실패 ' + run.failed}"></p><p th:text="${run.error}"></p><p th:text="${run.startedAt + ' ~ ' + run.finishedAt}"></p><h2>원본 응답</h2><table><tr><th>요청 키</th><th>크기(byte)</th><th>체크섬</th><th>보기</th></tr><tr th:each="raw : ${raws}"><td th:text="${raw.requestKey}"></td><td th:text="${raw.size}"></td><td th:text="${raw.checksum}"></td><td><a th:href="@{/admin/ingest/runs/{id}(id=${run.id},rawId=${raw.id})}">JSON 보기</a></td></tr></table><section th:if="${payload != null}"><h2>원본 JSON (앞 20KB)</h2><pre th:text="${payload}"></pre></section></main></body></html>
