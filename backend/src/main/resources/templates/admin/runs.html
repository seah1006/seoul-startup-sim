<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('수집 실행 목록')}"></head><body><header th:replace="~{admin/fragments :: nav}"></header><main><h1>수집 실행 목록</h1><form method="get"><label>출처<select name="source"><option value="">전체</option><option th:each="s : ${sources}" th:value="${s}" th:text="${s}" th:selected="${s == source}"></option></select></label><label>상태<select name="status"><option value="">전체</option><option th:each="s : ${ {'RUNNING','SUCCEEDED','FAILED'} }" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select></label><button>조회</button></form><table><thead><tr><th>번호</th><th>출처</th><th>기간</th><th>상태</th><th>건수</th><th>시작</th></tr></thead><tbody><tr th:each="run : ${runs}"><td><a th:href="@{/admin/ingest/runs/{id}(id=${run.id})}" th:text="${run.id}"></a></td><td th:text="${run.source}"></td><td th:text="${run.period}"></td><td th:text="${run.status}"></td><td th:text="${run.fetched}"></td><td th:text="${run.startedAt}"></td></tr></tbody></table><nav><a th:if="${page > 0}" th:href="@{/admin/ingest/runs(page=${page - 1},source=${source},status=${status})}">이전</a><span th:text="${page + 1}"></span><a th:if="${hasNext}" th:href="@{/admin/ingest/runs(page=${page + 1},source=${source},status=${status})}">다음</a></nav></main></body></html>
