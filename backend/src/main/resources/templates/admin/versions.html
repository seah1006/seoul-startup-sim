<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('데이터 버전')}"></head><body><header th:replace="~{admin/fragments :: nav}"></header><main><h1>데이터 버전</h1><p th:if="${message}" th:text="${message}"></p><section><h2>정리 대상 미리보기</h2><p>활성·게임 고정·적재 중·현재 상권/점포 참조 버전은 삭제하지 않습니다.</p><ul><li th:each="v : ${purgeCandidates}" th:text="|#${v.id} ${v.source} ${v.period} (${v.status}, ${v.rowCount}행)|"></li></ul><form method="post" th:action="@{/admin/data-versions/purge}"><button type="submit" th:disabled="${#lists.isEmpty(purgeCandidates)}">미사용 버전 정리</button></form></section><table><tr><th>출처</th><th>기간</th><th>상태</th><th>행 수</th><th>생성 시각</th><th>활성 시각</th></tr><tr th:each="v : ${versions}"><td th:text="${v.source}"></td><td th:text="${v.period}"></td><td th:text="${v.status}"></td><td th:text="${v.rowCount}"></td><td th:text="${v.createdAt}"></td><td th:text="${v.activatedAt}"></td></tr></table></main></body></html>
