<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('랭킹')}"></head><body><header th:replace="~{admin/fragments :: nav}"></header><main><h1>랭킹</h1><section><p>30분마다(KST 매시 0분·30분)와 앱 시작 직후 오늘 랭킹을 다시 계산합니다. 00시대에는 어제도 다시 계산합니다.</p><p>마지막 갱신(스냅샷 기준): <strong id="last-refreshed" th:text="${lastRefreshedAt != null ? lastRefreshedAt : '아직 없음'}"></strong></p><p th:if="${lastRun != null}" th:text="|이 서버의 마지막 실행: ${lastRun.refreshedAt} (${lastRun.dates})|"></p><form method="post" th:action="@{/admin/rankings/refresh}"><button type="submit">지금 갱신</button></form></section><table><tr><th>날짜(KST)</th><th>엔딩 기록</th><th>스냅샷 갱신 시각</th></tr><tr th:each="d : ${days}"><td th:text="${d.date}"></td><td th:text="${d.records}"></td><td th:text="${d.refreshedAt}"></td></tr></table></main></body></html>
