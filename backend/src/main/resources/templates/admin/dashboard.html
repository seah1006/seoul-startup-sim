<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('수집 대시보드')}"></head><body><header th:replace="~{admin/fragments :: nav}"></header><main><h1>수집 대시보드</h1><section class="cards"><article th:each="card : ${cards}"><h2 th:text="${card.source}"></h2><dl><dt>마지막 성공</dt><dd th:text="${card.lastSuccess ?: '기록 없음'}"></dd><dt>최근 10회 성공률</dt><dd th:text="${#numbers.formatDecimal(card.successRate,1,1) + '%'}"></dd><dt>마지막 수집 건수</dt><dd th:text="${card.lastCount}"></dd><dt>실행 중</dt><dd th:text="${card.running ? '실행 중' : '대기'}"></dd><dt>서킷 브레이커</dt><dd th:text="${#strings.startsWith(card.source,'seoul-') ? circuit : '해당 없음'}"></dd></dl></article></section></main></body></html>
