<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${page.title}">엔딩 기록</title>
<meta name="description" th:content="${page.description}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="서울 창업 시뮬레이션">
<meta property="og:title" th:content="${page.title}">
<meta property="og:description" th:content="${page.description}">
<meta property="og:image" th:content="${ogImage}">
<meta property="og:url" th:content="${pageUrl}">
<meta name="twitter:card" content="summary_large_image">
<style>
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eef3f7;color:#1d2733}
.card{max-width:560px;margin:48px auto;padding:32px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.ending{display:inline-block;margin:0;padding:4px 12px;border-radius:999px;background:#1f3a5f;color:#fff;font-weight:bold}
h1{margin:16px 0 4px;font-size:32px;word-break:break-all}
.meta{margin:0 0 24px;color:#5b6876}
dl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0}
dt{font-size:14px;color:#5b6876}
dd{margin:4px 0 0;font-size:20px;font-weight:bold;word-break:break-all}
.note{margin-top:24px;font-size:13px;color:#5b6876}
.record{margin-top:24px;padding:16px;border-radius:12px;background:#f3f7f5}
.record-label{margin:0 0 4px;font-size:14px;color:#5b6876}
.record-link{font-weight:bold;color:#1f3a5f;word-break:break-all}
.record-count{margin-left:8px;font-size:13px;color:#5b6876}
.cta{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:8px;background:#3d7a6b;color:#fff;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<main class="card">
  <p class="ending" th:text="${page.endingLabel}">엔딩</p>
  <h1 th:text="${page.shopName}">가게 이름</h1>
  <p class="meta"><span th:text="${page.areaName}">상권</span> · <span th:text="${page.serviceName}">업종</span></p>
  <dl>
    <div><dt>사장님</dt><dd th:text="${page.ownerName}"></dd></div>
    <div><dt>플레이어</dt><dd th:text="${page.nickname}"></dd></div>
    <div><dt>생존</dt><dd th:text="|${page.survivedQuarters}분기|"></dd></div>
    <div><dt>누적 순이익</dt><dd th:text="${page.totalProfit}"></dd></div>
    <div><dt>최고 분기 순이익</dt><dd th:text="${page.bestQuarterProfit}"></dd></div>
    <div><dt>매장 수</dt><dd th:text="|${page.shopCount}곳|"></dd></div>
  </dl>
  <section class="record" th:if="${recordLink != null}">
    <p class="record-label">이 가게의 인증글</p>
    <a class="record-link" th:href="@{${recordLink.postUrl}}" th:text="${recordLink.title}">인증글 제목</a>
    <span class="record-count" th:text="|댓글 ${recordLink.commentCount}개|">댓글 0개</span>
  </section>
  <p class="note">게임 속 가상 가게의 기록입니다. 매출은 서울시 상권분석서비스 자료를 바탕으로 서버가 계산했습니다.</p>
  <a class="cta" th:href="@{/}">나도 창업해 보기</a>
</main>
</body>
</html>
