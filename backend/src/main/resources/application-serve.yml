spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
server:
  port: 8080
  forward-headers-strategy: framework
app:
  ingest:
    schedule:
      enabled: false
  security:
    # app has no published port. Caddy overwrites XFF, on the private edge network.
    trust-proxy: true
logging:
  level:
    root: INFO
