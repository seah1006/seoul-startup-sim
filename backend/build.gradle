plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.seah'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
repositories {
    mavenCentral()
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.postgresql:postgresql'
    implementation 'io.github.resilience4j:resilience4j-retry:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'benchmark', 'simulation' }
}
tasks.register('simulate', Test) {
    description = '메인 DB SELECT 전용 12분기 밸런스 시뮬레이션'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'simulation' }
    systemProperty 'simulation.url', System.getProperty('simulation.url', 'jdbc:postgresql://localhost:5433/seoul_startup_sim')
    testLogging { showStandardStreams = true }
}
tasks.register('benchmark', Test) {
    description = '로컬 compose DB에서 상가 대량 적재 측정 (기존 stores 삭제)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark' }
    systemProperty 'sbiz.csv', System.getProperty('sbiz.csv', '')
    maxHeapSize = '1g'
    testLogging { showStandardStreams = true }
}


tasks.register('simulateV14', Test) {
    description = '읽기 전용 실데이터와 Testcontainers V14 콘텐츠로 진행·미션 측정'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'simulation' }
    filter { includeTestsMatching '*EventBalanceSimulationTest' }
    systemProperty 'simulation.v14', 'true'
    systemProperty 'simulation.url', System.getProperty('simulation.url', 'jdbc:postgresql://localhost:5433/seoul_startup_sim')
    testLogging { showStandardStreams = true }
}
