services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    mem_limit: 300m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20, -c, work_mem=4MB]
    environment:
      POSTGRES_DB: seoul_startup_sim
      POSTGRES_USER: ${DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d seoul_startup_sim']
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    image: eclipse-temurin:25-jre
    restart: unless-stopped
    mem_limit: 520m
    command: [java, -Xmx256m, '-XX:MaxMetaspaceSize=128m', '-XX:+UseSerialGC', -Xss512k, '-XX:TieredStopAtLevel=1', -jar, /app/app.jar]
    environment:
      SPRING_PROFILES_ACTIVE: serve
      DB_URL: jdbc:postgresql://db:5432/seoul_startup_sim
      DB_USERNAME: ${DB_USERNAME:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
    volumes:
      - ./app.jar:/app/app.jar:ro
    networks: [database, edge]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/health/db HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 6
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    mem_limit: 80m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
networks:
  database:
    internal: true
  edge:
volumes:
  db_data:
  caddy_data:
  caddy_config:
